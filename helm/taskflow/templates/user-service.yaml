apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.userService.replicaCount }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: user-service
          image: "{{ .Values.image.prefix }}-user-service:{{ .Values.userService.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
            - name: JWT_SECRET
              value: {{ required "secrets.jwtSecret is required. Provide it with --values ./helm/taskflow/values.secret.yaml" .Values.secrets.jwtSecret | quote }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgres.user (required "secrets.postgresPassword is required. Provide it with --values ./helm/taskflow/values.secret.yaml" .Values.secrets.postgresPassword) .Values.postgres.db | quote }}
            - name: OTEL_SERVICE_NAME
              value: user-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
