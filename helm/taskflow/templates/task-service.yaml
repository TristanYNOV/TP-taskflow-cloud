apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.taskService.replicaCount }}
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: task-service
          image: "{{ .Values.image.prefix }}-task-service:{{ .Values.taskService.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "3002"
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgres.user (required "secrets.postgresPassword is required. Provide it with --values ./helm/taskflow/values.secret.yaml" .Values.secrets.postgresPassword) .Values.postgres.db | quote }}
            - name: REDIS_URL
              value: redis://redis-master:6379
            - name: OTEL_SERVICE_NAME
              value: task-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.taskService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: task-service
  ports:
    - port: 3002
      targetPort: 3002
