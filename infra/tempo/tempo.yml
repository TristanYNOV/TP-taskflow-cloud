server:
  http_listen_port: 3200 # API Tempo + endpoint query pour Grafana

# Tempo reçoit les traces OTLP du collector sur gRPC.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
